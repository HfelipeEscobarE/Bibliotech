<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bibliotech - Catálogo</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

<div class="w3-bar w3-black w3-border-bottom w3-border-dark-grey">
    <span class="w3-bar-item w3-text-yellow"><b>BIBLIOTECH</b></span>
    <!-- Los botones se arman según haya sesión o no (catalogFrontController.js) -->
    <div id="navActions" class="w3-right"></div>
</div>

<div class="w3-container w3-padding-32">
    <h2 class="w3-text-white">Catálogo de documentos</h2>
    <p>Puedes consultar el catálogo sin cuenta. Para leer o descargar un documento necesitas iniciar sesión.</p>

    <input id="searchInput" class="w3-input w3-border w3-round w3-transparent w3-text-white w3-margin-bottom" 
           type="search" placeholder="Buscar por título, autor o categoría...">

    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered vault-card">
            <thead>
                <tr class="w3-yellow">
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoría</th>
                    <th>Subido por</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="catalogTableBody">
            </tbody>
        </table>
    </div>
</div>

<script src="../js/services/apiService.js"></script>
<script src="../js/components/uiHandlers.js"></script>
<script src="../js/utils/authHelper.js"></script>
<script src="../js/components/documentComponents.js"></script>
<script src="../js/components/pdfViewer.js"></script>
<script src="../js/frontControllers/catalogFrontController.js"></script>
</body>
</html>
